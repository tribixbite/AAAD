// Top-level build file. Plugin versions are declared here and applied in :app.
//
// Fork note: the upstream file also applied `com.google.gms:google-services`. This fork is
// standalone — no Firebase, no backend — so that plugin and its `google-services.json`
// requirement are gone. See docs/standalone.md.
plugins {
    id 'com.android.application'      version '8.13.1' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.21' apply false
    id 'org.jetbrains.kotlin.kapt'    version '2.2.21' apply false
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
