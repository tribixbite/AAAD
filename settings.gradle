pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    // PREFER_SETTINGS rather than FAIL_ON_PROJECT_REPOS: repositories live here, but a
    // stray project-level block downgrades to a warning instead of failing the build.
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        // BottomDialogs (com.github.iGio90) is only published on JitPack.
        maven { url = 'https://jitpack.io' }
    }
}

rootProject.name = 'AAAD'
include ':app'
