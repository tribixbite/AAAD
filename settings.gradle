pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    // PREFER_SETTINGS rather than FAIL_ON_PROJECT_REPOS: repositories live here, but a
    // stray project-level block downgrades to a warning instead of failing the build.
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        // No JitPack: the only dependency that needed it was BottomDialogs, removed in T-19.
        // Re-adding it means re-adding a build that can fail on someone else's CI capacity.
    }
}

rootProject.name = 'AAAD'
include ':app'
