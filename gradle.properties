# Memory: sized for building on-device under Termux. build-on-termux.sh overrides
# org.gradle.jvmargs on the command line for --low-mem runs; CI overrides upward.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8 -Duser.timezone=UTC
org.gradle.workers.max=2
org.gradle.parallel=true
org.gradle.caching=true
# 15 min instead of the 3h default — reclaims ~250 MB resident on a phone.
org.gradle.daemon.idletimeout=900000

android.useAndroidX=true
android.nonTransitiveRClass=true

# Reproducibility: no unique build id in META-INF, stable resource paths.
android.suppressBuildId=true
android.enableResourcePathShortening=false

# Termux ARM64: the aapt2 shipped in the AGP Maven artifact is an x86_64 glibc binary and
# cannot execute here. build-on-termux.sh passes
#   -Pandroid.aapt2FromMavenOverride=$PREFIX/bin/aapt2
# on the command line rather than pinning it in this file, so CI (x86_64 Linux) keeps
# using the stock aapt2 with no per-environment branching.
