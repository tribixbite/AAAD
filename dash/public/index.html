<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AAAD dash</title>
<style>
  /* Dark-first: this is read on a phone, usually at night, next to the device under test.
     Everything is inline — the dash must work with no network at all. */
  :root {
    color-scheme: dark;
    --bg: #0e1211;
    --surface: #161c1a;
    --line: #26302d;
    --text: #e6ece9;
    --muted: #93a29d;
    --ok: #7fd1a8;
    --bad: #ef8f7e;
    --warn: #e8c37a;
    --accent: #9ecfbb;
  }
  * { box-sizing: border-box; }
  html, body { max-width: 100%; }
  body {
    margin: 0; padding: max(16px, env(safe-area-inset-top)) 16px 32px;
    background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  h2 { font-size: 1rem; margin: 28px 0 10px; color: var(--muted); font-weight: 600;
       text-transform: uppercase; letter-spacing: .06em; }
  .sub { color: var(--muted); margin: 0 0 8px; }
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; padding: 14px; margin-bottom: 10px;
    /* min-width:0 lets the nowrap tables inside shrink instead of forcing the card — and the
       page — wider than the viewport. Without it the whole body scrolls sideways. */
    min-width: 0; overflow: hidden;
  }
  .row { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .grow { flex: 1 1 auto; min-width: 0; }
  .mono { font-family: ui-monospace, monospace; font-size: .85em; color: var(--muted);
          overflow-wrap: anywhere; }
  .pill { font-size: .75rem; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line);
          white-space: nowrap; }
  .ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
  .bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
  .warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
  /* Wide content scrolls inside its own box; the page itself never scrolls sideways. */
  .scroll-x { overflow-x: auto; max-width: 100%; -webkit-overflow-scrolling: touch; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line);
           white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; }
  img.shot { width: 100%; max-width: 240px; border-radius: 10px; border: 1px solid var(--line);
             display: block; margin-top: 10px; }
  .empty { color: var(--muted); font-style: italic; }
  /* A button in a heading, styled down to look like part of it rather than a call to action —
     the catalog view is already live on load; this only forces a fresh release lookup. */
  h2 button { font: inherit; text-transform: none; letter-spacing: 0; color: var(--accent);
              background: none; border: 1px solid var(--line); border-radius: 999px;
              padding: 1px 10px; cursor: pointer; }
  h2 button[disabled] { opacity: .5; cursor: default; }
  a { color: var(--accent); }
</style>
</head>
<body>
  <h1>AAAD dash</h1>
  <p class="sub" id="tagline">Devices, runs, and what Android Auto will actually list.</p>

  <h2>Devices</h2>
  <div id="devices"><p class="empty">loading…</p></div>

  <h2>Catalog <button id="refresh-catalog" title="Re-check published versions">refresh</button></h2>
  <div id="catalog"><p class="empty">loading…</p></div>

  <h2>Baselines</h2>
  <div id="baselines"><p class="empty">loading…</p></div>

  <h2>Runs</h2>
  <div id="runs"><p class="empty">loading…</p></div>

<script type="module">
const $ = (id) => document.getElementById(id);
const esc = (value) => String(value ?? "").replace(/[<>&]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]));

async function getJSON(path) {
  const response = await fetch(path);
  if (!response.ok) throw new Error(`${path} -> ${response.status}`);
  return response.json();
}

function renderDevices(devices) {
  if (!devices.length) {
    $("devices").innerHTML = '<p class="empty">No device connected.</p>';
    return;
  }
  $("devices").innerHTML = devices.map((device) => `
    <div class="card row">
      <div class="grow">
        <strong>${esc(device.model)}</strong>
        <div class="mono">${esc(device.serial)}</div>
      </div>
      <span class="pill">Android ${esc(device.androidRelease)} · SDK ${esc(device.sdk)}</span>
    </div>`).join("");
}

/**
 * Catalog state per device. The interesting column is `installer`: an app can be installed and
 * up to date and still be invisible to Android Auto because the install was never attributed.
 */
function renderCatalog(view) {
  const fetched = view.latest?.fetchedAt
    ? `published versions as of ${new Date(view.latest.fetchedAt).toLocaleString()}`
    : "no release data yet";

  if (!view.devices?.length) {
    $("catalog").innerHTML = `<p class="empty">No device connected. ${esc(fetched)}.</p>`;
    return;
  }

  $("catalog").innerHTML = view.devices.map((device) => {
    if (device.error) {
      return `<div class="card"><strong>${esc(device.model)}</strong>
        <div class="mono bad">could not read: ${esc(device.error)}</div></div>`;
    }
    const installed = device.entries.filter((entry) => entry.installedVersion).length;
    const unattributed = device.entries.filter(
      (entry) => entry.installedVersion && !entry.playAttributed).length;
    return `
    <div class="card">
      <div class="row">
        <strong class="grow">${esc(device.model)}</strong>
        <span class="pill">${installed}/${device.entries.length} installed</span>
        ${unattributed
          ? `<span class="pill bad">${unattributed} unattributed</span>`
          : '<span class="pill ok">all attributed</span>'}
      </div>
      <div class="mono">${esc(device.serial)} · ${esc(fetched)}</div>
      <div class="scroll-x"><table>
        <tr><th>app</th><th>installed</th><th>published</th><th>installer</th></tr>
        ${device.entries.map((entry) => {
          const version = entry.installedVersion
            ? `<td>${esc(entry.installedVersion)}</td>`
            : '<td class="empty">not installed</td>';
          // Only three states are claimed: newer available, current, or unknown. `updateAvailable`
          // is null when the two versions cannot be ordered, and that is shown as a dash.
          const published = entry.latestVersion
            ? `<td class="${entry.updateAvailable === true ? "warn" : ""}">${esc(entry.latestVersion)}${
                entry.updateAvailable === true ? " ↑" : ""}</td>`
            : '<td class="empty">—</td>';
          const installer = !entry.installedVersion
            ? '<td class="empty">—</td>'
            : `<td class="${entry.playAttributed ? "ok" : "bad"}">${esc(entry.installer ?? "none")}</td>`;
          return `<tr><td>${esc(entry.name)}</td>${version}${published}${installer}</tr>`;
        }).join("")}
      </table></div>
    </div>`;
  }).join("");
}

function renderBaselines(baselines) {
  if (!baselines.length) {
    $("baselines").innerHTML = '<p class="empty">None recorded yet — run the harness with --accept true.</p>';
    return;
  }
  $("baselines").innerHTML = baselines.map((baseline) => `
    <div class="card">
      <div class="row">
        <strong class="grow">${esc(baseline.model)}</strong>
        <span class="pill">SDK ${esc(baseline.sdk)}</span>
      </div>
      <div class="mono">updated ${esc(baseline.updated)}</div>
      <div class="scroll-x"><table>
        <tr><th>app</th><th>outcome</th><th>attributed</th></tr>
        ${baseline.entries.map((entry) => `
          <tr><td>${esc(entry.appId)}</td><td>${esc(entry.outcome)}</td>
          <td class="${entry.playAttributed ? "ok" : "bad"}">${entry.playAttributed}</td></tr>`).join("")}
      </table></div>
    </div>`).join("");
}

function renderRuns(runs) {
  if (!runs.length) {
    $("runs").innerHTML = '<p class="empty">No runs yet. <span class="mono">cd harness &amp;&amp; bun run src/cli.ts matrix --apps &lt;id&gt;</span></p>';
    return;
  }
  $("runs").innerHTML = runs.map((run) => {
    const attributed = run.records.filter((record) => record.playAttributed).length;
    // The headline number is attribution, because that is the assertion the harness can actually
    // make — Android Auto visibility itself is not observable without a projection session.
    const state = attributed === run.records.length ? "ok" : attributed === 0 ? "bad" : "warn";
    return `
    <div class="card">
      <div class="row">
        <strong class="grow">${esc(run.records[0]?.model ?? "run")}</strong>
        <span class="pill ${state}">${attributed}/${run.records.length} Play-attributed</span>
      </div>
      <div class="mono">${esc(run.id)}</div>
      <div class="scroll-x"><table>
        <tr><th>app</th><th>outcome</th><th>installer</th><th>AA visible</th></tr>
        ${run.records.map((record) => `
          <tr>
            <td>${esc(record.appId)}</td>
            <td>${esc(record.outcome)}</td>
            <td class="${record.playAttributed ? "ok" : "bad"}">${esc(record.installer ?? "—")}</td>
            <td class="warn">${esc(record.androidAutoVisible)}</td>
          </tr>`).join("")}
      </table></div>
      ${run.records.filter((record) => record.screenshot).map((record) => `
        <img class="shot" loading="lazy" alt="${esc(record.appId)} after install"
             src="/screenshots/${encodeURIComponent(run.id)}/${encodeURIComponent(record.screenshot.split("/").pop())}">`).join("")}
    </div>`;
  }).join("");
}

async function refresh(refreshReleases = false) {
  const [devices, runs, baselines, catalog] = await Promise.all([
    getJSON("/api/devices").catch(() => []),
    getJSON("/api/runs").catch(() => []),
    getJSON("/api/baselines").catch(() => []),
    getJSON(refreshReleases ? "/api/catalog?refresh=1" : "/api/catalog").catch(() => ({ devices: [] })),
  ]);
  renderDevices(devices);
  renderCatalog(catalog);
  renderRuns(runs);
  renderBaselines(baselines);
}

$("refresh-catalog").addEventListener("click", async (event) => {
  // Disabled while in flight: this is the one control that spends the GitHub rate limit, and
  // repeat-clicking it while waiting is the fastest way to run out.
  const button = event.currentTarget;
  button.disabled = true;
  button.textContent = "checking…";
  try {
    await refresh(true);
  } finally {
    button.disabled = false;
    button.textContent = "refresh";
  }
});

refresh();
// Devices come and go (this phone's adb port rotates); runs only change when one is started.
setInterval(refresh, 15000);
</script>
</body>
</html>
