plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

// local.properties is OPTIONAL in this fork. Upstream read it unconditionally, so a missing
// file failed configuration before any compile error was reachable. Standalone builds need
// nothing from it; it only carries an optional catalog URL and optional signing overrides.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

/** Env var wins over local.properties, so CI can inject without writing files. */
def cfg = { String key, String fallback ->
    System.getenv(key) ?: localProperties.getProperty(key, fallback)
}

android {
    namespace = 'com.legs.appsforaa'
    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/ASL2.0',
                'META-INF/*.kotlin_module',
                // Kept from upstream as a defensive exclude; its original cause (BouncyCastle)
                // is no longer a dependency, but multi-release jars still trip over this entry.
                'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
            ]
        }
    }

    lint {
        // App falls back to English when a locale is incomplete (30 locales via Crowdin).
        disable 'MissingTranslation', 'ImpliedQuantity'
        abortOnError false
        checkReleaseBuilds true
    }

    defaultConfig {
        applicationId = "sksa.aa.customapps"
        minSdk = 24            // Shizuku floor (Android 7.0+)
        targetSdk = 36
        versionCode = 18
        versionName = "2.1"
        base.archivesName = "AAAD-" + versionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // The ONLY remaining external configuration. Empty is valid and supported: the app
        // then uses the catalog bundled in assets and never contacts a server for metadata.
        // Set CATALOG_URL in local.properties or the environment to point at a remote catalog.
        buildConfigField "String", "CATALOG_URL", "\"${cfg('CATALOG_URL', '')}\""

        // The GitHub repo this build checks for its own updates. Empty disables the check
        // entirely, which is the right setting for a build that is not distributed.
        buildConfigField "String", "UPDATE_REPO", "\"${cfg('UPDATE_REPO', 'tribixbite/AAAD')}\""
    }

    sourceSets {
        main.assets.srcDir(layout.buildDirectory.dir("generated/carify-assets"))
    }

    // Signing is env-var driven (same contract as ../swype/cleverkeys and the
    // android-termux-build skill) so no keystore path is ever committed:
    //   RELEASE_KEYSTORE, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
    // When RELEASE_KEYSTORE is unset, release falls back to the debug key so a local build
    // always produces an installable APK. Such an APK is NOT distributable.
    signingConfigs {
        release {
            def keystorePath = cfg('RELEASE_KEYSTORE', '')
            if (keystorePath.trim().length() > 0 && file(keystorePath).exists()) {
                storeFile file(keystorePath)
                storePassword cfg('RELEASE_KEYSTORE_PASSWORD', '')
                keyAlias cfg('RELEASE_KEY_ALIAS', 'release')
                keyPassword cfg('RELEASE_KEY_PASSWORD', '')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release.storeFile != null
                ? signingConfigs.release
                : signingConfigs.debug
        }
        debug {
            // Distinct applicationId so a dev build coexists with an official AAAD install
            // and can never overwrite or wipe its data. The test harness relies on this.
            applicationIdSuffix '.dev'
            debuggable true
            resValue "string", "app_name", "AAAD (dev)"
        }
    }
}

/*
 * Produce the DEX injected into converted phone apps.
 *
 * The bridge APK's AndroidX AppInfo reads its library version from a 0x7f resource id. A converted
 * app owns a different resource table, so that one lookup is made package-independent before the
 * DEX is bundled as an AAAD asset. This is the same guarded rewrite used by tools/carify.sh.
 */
def carifyToolJar = file("libs/APKEditor-1.4.8.jar")
def carifyBridgeApk = rootProject.file(
    "carify-bridge/build/outputs/apk/release/carify-bridge-release-unsigned.apk"
)
def carifyAssetDir = layout.buildDirectory.dir("generated/carify-assets/carify")
def carifyWorkDir = layout.buildDirectory.dir("intermediates/carify-bridge-dex")

tasks.register("prepareCarifyBridgeDex") {
    dependsOn(":carify-bridge:assembleRelease")
    inputs.file(carifyBridgeApk)
    inputs.file(carifyToolJar)
    outputs.file(carifyAssetDir.map { it.file("bridge.dex") })

    doLast {
        def work = carifyWorkDir.get().asFile
        def raw = new File(work, "raw")
        def smali = new File(work, "smali")
        delete(work)
        raw.mkdirs()
        smali.mkdirs()

        copy {
            from(zipTree(carifyBridgeApk))
            include("classes*.dex")
            into(raw)
        }
        def dexFiles = fileTree(raw).matching { include("classes*.dex") }.files.sort()
        if (dexFiles.size() != 1) {
            throw new GradleException(
                "Carify bridge must produce exactly one DEX, got ${dexFiles.size()}"
            )
        }

        javaexec {
            classpath = files(carifyToolJar)
            mainClass = "org.jf.baksmali.Main"
            args("d", dexFiles.first().absolutePath, "-o", smali.absolutePath)
        }

        def appInfoFiles = fileTree(smali).matching {
            include("**/androidx/car/app/AppInfo.smali")
        }.files
        if (appInfoFiles.size() != 1) {
            throw new GradleException("Injected bridge is missing androidx.car.app.AppInfo")
        }
        def appInfo = appInfoFiles.first()
        def lines = appInfo.readLines("UTF-8")
        def start = lines.findIndexOf {
            it.contains("Context;->getResources()Landroid/content/res/Resources;")
        }
        def getString = start < 0 ? -1 : (start..<lines.size()).find {
            lines[it].contains("Resources;->getString(I)Ljava/lang/String;")
        } ?: -1
        def end = getString < 0 ? -1 : (getString..<lines.size()).find {
            lines[it].contains("move-result-object p0")
        } ?: -1
        if (start < 0 || getString < 0 || end < 0) {
            throw new GradleException(
                "Car App AppInfo version lookup changed; refusing unsafe payload"
            )
        }
        lines.subList(start, end + 1).clear()
        lines.add(start, '    const-string p0, "1.7.0"')
        appInfo.setText(lines.join("\n") + "\n", "UTF-8")

        def output = carifyAssetDir.get().file("bridge.dex").asFile
        output.parentFile.mkdirs()
        javaexec {
            classpath = files(carifyToolJar)
            mainClass = "org.jf.smali.Main"
            args("a", smali.absolutePath, "-o", output.absolutePath)
        }
    }
}
tasks.named("preBuild").configure { dependsOn("prepareCarifyBridgeDex") }

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])

    // AndroidX core
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.2.21"

    // Networking: catalog fetch + APK download. Jsoup scrapes publisher pages that have no API.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'commons-io:commons-io:2.21.0'
    implementation 'org.jsoup:jsoup:1.21.2'

    // Local state: catalog cache, prefs, background refresh
    implementation 'androidx.room:room-runtime:2.8.4'
    implementation 'androidx.room:room-ktx:2.8.3'
    kapt 'androidx.room:room-compiler:2.8.4'
    implementation 'androidx.datastore:datastore-preferences:1.2.0'
    implementation 'androidx.work:work-runtime:2.11.0'
    implementation 'androidx.work:work-runtime-ktx:2.11.0'

    // UI
    implementation 'com.github.bumptech.glide:glide:5.0.5'

    // Silent install on Android 14+ without root
    def shizuku_version = "13.1.5"
    implementation "dev.rikka.shizuku:api:$shizuku_version"
    implementation "dev.rikka.shizuku:provider:$shizuku_version"

    // Android Auto, via the *official* templated SDK. The unofficial projected SDK that
    // CarStream and Fermata use (com.google.android.gms.car, CATEGORY_PROJECTION) is not
    // published to any Maven repository, so it is not an option here. See TASKS.md T-44.
    implementation 'androidx.car.app:app:1.7.0'
    implementation 'androidx.car.app:app-projected:1.7.0'

    // Pure-Java Android SDK signer used for side-by-side Carify clones.
    implementation 'com.android.tools.build:apksig:8.13.1'

    // REMOVED for the standalone fork (see docs/standalone.md):
    //   com.github.iGio90:BottomDialogs (JitPack)          — T-19. An unpinnable
    //     master-SNAPSHOT that broke the build three times: a JitPack read timeout, a
    //     pre-AndroidX support-compat collision, and finally a CI failure resolving it at all.
    //     utils/BottomDialog and utils/UtilsLibrary referenced only each other — dead code
    //     inherited from the source drop — so both were deleted with it. Upstream v2.8.5
    //     dropped BottomDialogs too.
    //   org.bouncycastle bcpkix/bcprov 1.82                — on-device APK re-signing
    //     Upstream carried these only for ApkRepackager/ApkSigner/BundledApkSigner, a chain that
    //     cannot execute on a stock device: the bundled apksigner.jar has no classes.dex, so
    //     `dalvikvm -cp` aborts. AA visibility comes from installer attribution, not re-signing.
    //     Evidence: docs/aa-visibility.md.
    //   firebase-bom + database/storage/auth/functions  — backend entitlement + catalog
    //   com.stripe:stripe-android                        — PRO purchase
    //   com.github.blikoon:QRCodeScanner (+ zxing)       — QR license transfer
    //   com.android.volley:volley                        — superseded by OkHttp
    //   commons-net:commons-net                          — NTP clock for the quota gate

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
