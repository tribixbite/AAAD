# Tested debug APK build and rolling latest release.
#
# Runs on x86_64 Linux, where AGP's Maven aapt2 executes normally — so unlike the on-device
# build there is no aapt2 override here (see build-on-termux.sh).
#
# The standalone fork needs NO secrets to build: no google-services.json, no Stripe keys, no
# Firebase project. A fork of this repo builds green out of the box.

name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags-ignore: ['v*']          # tags are handled by release.yml
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build app and Carify bridge
        run: ./gradlew :app:assembleDebug :carify-bridge:assembleRelease --stacktrace --console=plain

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --console=plain

      - name: Lint
        run: ./gradlew :app:lint --console=plain

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Name the APK with its commit
        run: |
          cd app/build/outputs/apk/debug
          for apk in *.apk; do
            mv "$apk" "AAAD-dev-${{ steps.sha.outputs.short }}.apk"
          done
          ls -la *.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aaad-debug-${{ steps.sha.outputs.short }}
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish latest development release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2.6.2
        with:
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
          overwrite_files: true
          tag_name: dev-${{ steps.sha.outputs.short }}
          name: AAAD dev build (${{ steps.sha.outputs.short }})
          prerelease: false
          make_latest: true
          body: |
            Standalone AAAD fork — development build. No backend, no PRO tier, unlimited downloads.

            **Commit:** ${{ github.sha }}
            **Package:** `sksa.aa.customapps.dev` — installs alongside an official AAAD build.

            Signed with a CI debug key. Personal use only; not a redistribution of upstream AAAD.

            This rolling development release is published for every push to main, so
            /releases/latest always resolves to the newest successful APK build.
